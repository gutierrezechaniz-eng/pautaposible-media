<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Manrope;font-weight:600;src:url(node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff2)}
@font-face{font-family:Manrope;font-weight:700;src:url(node_modules/@fontsource/manrope/files/manrope-latin-700-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2)}
:root{--forest:#2E6F57;--cream:#FAFAF7;--mint:#DDEEDF;--sage:#6FA67A;--gold:#D7A95B;--char:#24322A;--coral:#D9714E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:Manrope,sans-serif;color:var(--char);background:var(--cream)}
#s{position:absolute;inset:0;overflow:hidden}
.dark{background:var(--forest);color:var(--cream)}
.light{background:var(--cream)}
.mintbg{background:var(--mint)}
.a{position:absolute}
.blob{position:absolute;border-radius:50%}
.brand{position:absolute;left:80px;top:64px;display:flex;gap:14px;align-items:center;font-weight:800;font-size:28px}
.kick{position:absolute;left:80px;top:150px;display:inline-block;border-radius:999px;padding:12px 28px;font-weight:800;font-size:28px;letter-spacing:.5px;text-transform:uppercase;background:var(--forest);color:var(--cream)}
.dark .kick{background:var(--mint);color:var(--forest);text-transform:none;letter-spacing:0}
.title{position:absolute;left:80px;right:80px;top:225px;font-weight:800;font-size:76px;line-height:1.05;letter-spacing:-1.5px}
.title.xl{font-size:96px;top:240px}
.w{display:inline-block;white-space:pre}
.hl{color:var(--forest);background:var(--mint);border-radius:18px;padding:0 12px}
.dark .hl{color:var(--forest)}
.gold{color:var(--gold)}
.card{position:absolute;background:#fff;border-radius:36px;box-shadow:0 18px 50px rgba(36,50,42,.10)}
.note{position:absolute;left:80px;right:80px;border-radius:30px;background:var(--mint);padding:26px 34px;font-size:34px;font-weight:600;line-height:1.3}
.note b{font-weight:800;color:var(--forest)}
.lbl{position:absolute;font-weight:800;text-align:center}
.btn{display:inline-block;background:var(--cream);color:var(--forest);border-radius:999px;padding:28px 56px;font-weight:800;font-size:50px}
.foot{position:absolute;left:80px;right:80px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:700;opacity:.75}
.bar{position:absolute;left:0;bottom:0;height:12px;background:var(--gold)}
#subs{position:absolute;left:60px;right:60px;top:1132px;height:116px;display:flex;align-items:center;justify-content:center;text-align:center}
#subs .b{display:inline-block;max-width:960px;border-radius:28px;padding:12px 26px;background:rgba(36,50,42,.9);color:var(--cream);font-weight:800;font-size:36px;line-height:1.2;text-wrap:balance}
.dark #subs .b{background:var(--cream);color:var(--char)}
#subs .x{padding:0 4px;border-radius:10px}
#subs .x.on{background:var(--gold);color:var(--char)}
#subs .x.todo{opacity:.45}
svg{overflow:visible}
</style></head>
<body><div id="s"></div>
<script>
// Animación por tiempo (render(t) determinista). Atributos en cualquier elemento (HTML o SVG):
//  data-in="seg [up|down|left|right|pop|zoom|drop|fade|draw|spin] [duración]"  entrada
//  data-out="seg"                     salida (desvanece)
//  data-float="amp periodo [fase]"    vaivén vertical continuo
//  data-nudge="amp periodo"           vaivén horizontal continuo
//  data-sway="grados periodo"         balanceo
//  data-pulse="escala periodo"        latido
//  data-mv="seg dx dy [duración]"     desplazamiento
//  data-count="seg dur desde hasta [decimales]"  número que cuenta
const clamp=(x,a=0,b=1)=>Math.min(Math.max(x,a),b);
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const bounce=x=>{x=clamp(x);const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
let D=6,EL=[],SUBS=[];
// Con narrador: cfg.cues = [[inicio, fin], …] por trozo de voz y cfg.subs = textos a mostrar. En los atributos, «c2+0.4» = inicio del trozo 2 + 0,4 s.
function setup(cfg){
  const s=document.getElementById('s');s.className=cfg.cls||'light';
  const cues=cfg.cues||[];
  const html=cfg.html.replace(/data-(in|out|mv|count)="c(\d+)([+-][\d.]+)?/g,(m,a,i,o)=>`data-${a}="${((cues[+i]||[0])[0]+(+o||0)).toFixed(2)}`);
  s.innerHTML=html+'<div id="subs"></div><div class="bar" id="bar"></div>';D=cfg.dur;
  SUBS=(cfg.subs||[]).map((txt,i)=>({ws:txt.split(' '),s:cues[i][0],e:cues[i][1],next:i+1<cues.length?cues[i+1][0]:D}));
  EL=[...s.querySelectorAll('[data-in],[data-out],[data-float],[data-nudge],[data-sway],[data-pulse],[data-mv],[data-count]')];
  EL.forEach(e=>{if(e instanceof SVGElement){e.style.transformBox='fill-box';e.style.transformOrigin=e.dataset.origin||'center'}
    if(e.dataset.in&&e.dataset.in.split(' ')[1]==='draw'){const L=e.getTotalLength?e.getTotalLength():1000;e.style.strokeDasharray=L;e._L=L}});
  return D;
}
function render(t){
  document.getElementById('bar').style.width=(100*clamp(t/D))+'%';
  const sb=SUBS.find(x=>t>=x.s-0.08&&t<x.next-0.02)||null;
  document.getElementById('subs').innerHTML=sb?`<span class="b">${(()=>{const L=sb.ws.join(' ').length;let acc=0;const k=clamp((t-sb.s)/(sb.e-sb.s))*L;
    return sb.ws.map(w=>{const a=acc;acc+=w.length+1;const st=k>=a&&k<acc?'on':(k>=acc?'':'todo');return `<span class="x ${st}">${w}</span>`}).join(' ')})()}</span>`:'';
  for(const e of EL){
    let tx=0,ty=0,sc=1,rot=0,op=1;const d=e.dataset;
    if(d.in){const [a,k='up',du]=d.in.split(' ');const t0=+a,dur=+(du||(k==='drop'?0.8:0.55));const p=(t-t0)/dur;
      const q=easeOut(p);op=clamp(p*2.2);
      if(k==='up')ty=(1-q)*60;else if(k==='down')ty=-(1-q)*60;else if(k==='left')tx=-(1-q)*120;else if(k==='right')tx=(1-q)*120;
      else if(k==='pop'){sc=p<=0?0.3:back(p)*0.7+0.3;if(p>=1)sc=1}else if(k==='zoom'){sc=1.6-0.6*q}
      else if(k==='drop'){ty=-(1-bounce(p))*420;op=clamp(p*4)}else if(k==='spin'){rot=(1-q)*-180;sc=0.4+0.6*q}
      else if(k==='draw'){e.style.strokeDashoffset=e._L*(1-q);op=p>0?1:0}
      if(p<=0)op=0}
    if(d.out){op*=1-easeOut((t-+d.out)/0.35)}
    if(d.float){const [a,per,ph=0]=d.float.split(' ').map(Number);ty+=a*Math.sin(2*Math.PI*(t/per+ph))}
    if(d.nudge){const [a,per]=d.nudge.split(' ').map(Number);tx+=a*Math.max(0,Math.sin(2*Math.PI*t/per))}
    if(d.sway){const [a,per]=d.sway.split(' ').map(Number);rot+=a*Math.sin(2*Math.PI*t/per)}
    if(d.pulse){const [a,per]=d.pulse.split(' ').map(Number);sc*=1+a*(0.5+0.5*Math.sin(2*Math.PI*t/per))}
    if(d.mv){const [a,dx,dy,du=0.7]=d.mv.split(' ').map(Number);const q=easeOut((t-a)/du);tx+=dx*q;ty+=dy*q}
    if(d.count){const [a,du,f,to,dec=0]=d.count.split(' ').map(Number);const v=f+(to-f)*easeOut((t-a)/du);e.textContent=v.toFixed(dec).replace('.',',')}
    e.style.opacity=op;
    e.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
  }
}
window.setup=setup;window.render=render;
</script></body></html>
