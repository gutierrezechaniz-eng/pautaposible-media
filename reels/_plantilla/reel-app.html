<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Manrope;font-weight:600;src:url(node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff2)}
@font-face{font-family:Manrope;font-weight:700;src:url(node_modules/@fontsource/manrope/files/manrope-latin-700-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2)}
:root{--forest:#2E6F57;--cream:#FAFAF7;--mint:#DDEEDF;--sage:#6FA67A;--gold:#D7A95B;--char:#24322A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:Manrope,sans-serif;color:var(--char)}
.layer{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%}
/* Zonas seguras: 12 % superior (230 px) y 20 % inferior (384 px) libres de texto */
#hook{background:var(--forest);color:var(--cream)}
#hook .icon{position:absolute;left:50%;top:330px;width:420px;height:420px;margin-left:-210px;border-radius:96px;overflow:hidden;box-shadow:0 0 0 18px rgba(221,238,223,.18),0 40px 90px rgba(0,0,0,.25)}
#hook .icon img{width:100%;height:100%;display:block}
#hook .glow{position:absolute;left:50%;top:540px;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:radial-gradient(circle,rgba(215,169,91,.42),rgba(215,169,91,0) 65%)}
#hook .title{position:absolute;left:60px;right:60px;top:830px;text-align:center;font-weight:800;font-size:100px;line-height:1.04;letter-spacing:-2.5px}
#hsubs{position:absolute;left:60px;right:60px;top:1170px;height:300px;display:flex;align-items:center;justify-content:center;text-align:center}
#main{opacity:0;z-index:1}
#end{z-index:2}
#hook{z-index:3}
#tagbar{position:absolute;left:0;right:0;top:236px;z-index:6;height:90px;text-align:center}
#tagbar .tag{position:absolute;left:50%;top:0;white-space:nowrap}
.tag{display:inline-block;border-radius:999px;padding:16px 38px;font-weight:800;font-size:40px;background:var(--forest);color:var(--cream)}
#phone{position:absolute;left:50%;top:336px;width:560px;height:1212px;margin-left:-280px;border-radius:76px;background:#1d2621;padding:14px;box-shadow:0 40px 90px rgba(36,50,42,.28),0 0 0 3px #3a463f inset;transform-origin:50% 35%}
#screen{position:relative;width:100%;height:100%;border-radius:62px;overflow:hidden;background:#fff}
#screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.tap{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:8px solid var(--gold);opacity:0;z-index:4}
.badge{position:absolute;display:flex;align-items:center;gap:14px;padding:18px 28px;border-radius:30px;background:#fff;box-shadow:0 18px 44px rgba(36,50,42,.16);font-weight:800;font-size:38px;line-height:1.1;white-space:nowrap;opacity:0;z-index:5}
.badge .ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:34px;color:#fff;background:var(--forest);flex:none}
.badge.gold .ico{background:var(--gold)}
.badge.big{font-size:52px;padding:24px 36px}
.badge.dark{background:var(--forest);color:var(--cream)}
.badge.dark .ico{background:var(--cream);color:var(--forest)}
#subs{position:absolute;left:40px;right:40px;top:1336px;height:212px;display:flex;align-items:center;justify-content:center;text-align:center;z-index:6;border-radius:44px;background:#FAFAF7;box-shadow:0 18px 50px rgba(36,50,42,.22)}
#subs:empty{display:none}
.blk{text-wrap:balance;font-weight:800;font-size:70px;line-height:1.14;letter-spacing:-1px;color:var(--char)}
.w{display:inline-block;padding:0 11px;margin:0 -2px;border-radius:20px}
.w.on{background:var(--mint);color:var(--forest)}
.w.done{color:var(--char)}
.w.todo{color:rgba(36,50,42,.38)}
#hook .blk{color:var(--cream)}
#hook .w.todo{color:rgba(250,250,247,.45)}
#hook .w.on{background:var(--mint);color:var(--forest)}
#hook .w.done{color:var(--cream)}
#end{background:var(--forest);color:var(--cream);opacity:0}
#end .zone{position:absolute;left:80px;right:80px;top:290px;display:flex;flex-direction:column;align-items:center;text-align:center}
.circle{border-radius:50%;background:var(--mint);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;width:100%;height:100%}
.circle img{width:94%;display:block}
.cta{display:inline-block;border-radius:999px;padding:30px 60px;font-weight:800;font-size:52px;background:var(--cream);color:var(--forest)}
.save{display:inline-block;border-radius:999px;padding:22px 56px;font-weight:800;font-size:44px;border:5px solid var(--gold);color:var(--cream)}
.e{opacity:0}
</style></head>
<body>
<div class="layer" id="main">
  <div class="blob" style="width:420px;height:420px;right:-170px;top:-140px;background:var(--mint)"></div>
  <div class="blob" style="width:64px;height:64px;left:80px;top:170px;background:var(--gold)"></div>
  <div class="blob" style="width:360px;height:360px;left:-190px;top:900px;background:var(--mint);opacity:.75"></div>
  <div class="blob" style="width:240px;height:240px;right:-110px;top:1040px;background:var(--mint);opacity:.6"></div>
  <div id="tagbar"></div>
  <div id="phone"><div id="screen"></div></div>
  <div id="badges"></div>
  <div id="subs"></div>
</div>
<div class="layer" id="hook">
  <div class="blob" style="width:560px;height:560px;right:-200px;top:-160px;background:rgba(111,166,122,.28)"></div>
  <div class="blob" style="width:380px;height:380px;left:-190px;top:1380px;background:rgba(111,166,122,.2)"></div>
  <div class="glow"></div>
  <div class="icon"><img id="hicon"></div>
  <div class="title" id="htitle"></div>
  <div id="hsubs"></div>
</div>
<div class="layer" id="end">
  <div class="blob" style="width:620px;height:620px;left:-270px;top:1250px;background:rgba(111,166,122,.25)"></div>
  <div class="blob" style="width:90px;height:90px;right:130px;top:250px;background:var(--gold)"></div>
  <div class="zone">
    <div class="e" data-d="0" style="width:280px;height:280px"><div class="circle" style="box-shadow:0 0 0 14px rgba(221,238,223,.22)"><img src="ivan.png"></div></div>
    <div class="e" data-d="0.08" style="font-weight:800;font-size:62px;margin-top:44px">Iván · Pauta Posible</div>
    <div class="e" data-d="0.16" style="font-weight:600;font-size:40px;margin-top:12px;opacity:.85">Nutrición práctica, sin miedo ni culpa</div>
    <div class="e" data-d="0.26" style="font-weight:700;font-size:46px;line-height:1.25;margin-top:60px" id="endline"></div>
    <div class="e" data-d="0.36" style="margin-top:44px"><span class="cta">pautaposible.es</span></div>
    <div class="e" data-d="0.42" style="font-weight:700;font-size:36px;margin-top:22px;opacity:.85">Enlace en la bio</div>
    <div class="e" data-d="0.5" style="margin-top:40px"><span class="save" id="endsave"></span></div>
  </div>
  <div class="e" data-d="0.55" style="position:absolute;left:0;right:0;top:1470px;text-align:center;font-weight:700;font-size:30px;color:rgba(250,250,247,.65)">@pautaposible</div>
</div>
<script>
// Reel de una app: gancho con el icono, teléfono con capturas reales que cambian con la voz,
// insignias que aparecen al nombrarlas, subtítulos palabra a palabra y cierre de 3 s.
const clamp=(x,a=0,b=1)=>Math.min(Math.max(x,a),b);
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const HOOK=2.5, XF=0.4, ENDXF=0.3;
let C, BLOCKS, SHOTS=[], BADGES=[], TAGS=[], TAPS=[];
function blocks(words){
  const phrases=[];let cur=[];
  words.forEach((w,i)=>{cur.push(w);if(/[.,:;?!]$/.test(w.w)||i===words.length-1){phrases.push(cur);cur=[]}});
  const len=a=>a.map(w=>w.w).join(' ').length;
  const merged=[];
  phrases.forEach(p=>{const last=merged[merged.length-1];
    if(last&&!/[.?!:]$/.test(last[last.length-1].w)&&last.length+p.length<=7&&len([...last,...p])<=32&&(last.length<=3||p.length<=2))merged[merged.length-1]=[...last,...p];else merged.push(p)});
  const out=[];
  merged.forEach(p=>{
    const n=Math.max(Math.ceil(p.length/7),Math.ceil(len(p)/32));
    let i=0;
    for(let part=n;part>1;part--){const k=i+Math.round((p.length-i)/part);out.push(p.slice(i,k));i=k}
    out.push(p.slice(i));
  });
  return out.map((ws,k)=>({ws,s:ws[0].s,e:k+1<out.length?out[k+1][0].s:C.dur+0.3}));
}
function setup(cfg){
  C=cfg;BLOCKS=blocks(cfg.words);
  document.getElementById('htitle').innerHTML=cfg.hook;
  document.getElementById('hicon').src=cfg.icon;
  document.getElementById('endline').innerHTML=cfg.endLine;
  document.getElementById('endsave').textContent=cfg.endButton;
  const screen=document.getElementById('screen');
  screen.innerHTML=cfg.shots.map((s,i)=>`<img id="s${i}" src="${s.src}">`).join('')+cfg.taps.map((t,i)=>`<div class="tap" id="t${i}" style="left:${t.x*100}%;top:${t.y*100}%"></div>`).join('');
  SHOTS=cfg.shots.map((s,i)=>({...s,el:document.getElementById('s'+i)}));
  TAPS=cfg.taps.map((t,i)=>({...t,el:document.getElementById('t'+i)}));
  document.getElementById('badges').innerHTML=cfg.badges.map((b,i)=>`<div class="badge ${b.cls||''}" id="b${i}" style="left:${b.x}px;top:${b.y}px"><span class="ico">${b.ico}</span><span>${b.text}</span></div>`).join('');
  BADGES=cfg.badges.map((b,i)=>({...b,el:document.getElementById('b'+i)}));
  document.getElementById('tagbar').innerHTML=cfg.tags.map((g,i)=>`<span class="tag" id="g${i}">${g.text}</span>`).join('');
  TAGS=cfg.tags.map((g,i)=>({...g,el:document.getElementById('g'+i)}));
  return cfg.dur+3.0; // cierre de 3 s (norma de calendario.md)
}
function subsHTML(t){
  const b=BLOCKS.find(b=>t>=b.s-0.05&&t<b.e)||(t<BLOCKS[0].s?BLOCKS[0]:null);
  if(!b)return '';
  return `<div class="blk">${b.ws.map(w=>{const st=t>=w.s&&t<w.e+0.05?'on':(t>=w.e?'done':'todo');return `<span class="w ${st}">${w.w}</span>`}).join(' ')}</div>`;
}
function render(t,opts={}){
  const dur=C.dur;
  // gancho
  const hk=document.getElementById('hook');
  hk.style.opacity=t<HOOK?1:1-ease((t-HOOK)/XF);
  const ip=back((t-0.05)/0.7);
  document.querySelector('#hook .icon').style.transform=`scale(${0.5+0.5*ip}) rotate(${(1-ease(t/0.8))*-8}deg)`;
  document.querySelector('#hook .icon').style.opacity=clamp(t/0.25);
  document.querySelector('#hook .glow').style.transform=`scale(${0.9+0.12*Math.sin(t*2.4)})`;
  const tt=document.getElementById('htitle'),tp=ease((t-0.25)/0.6);
  tt.style.opacity=tp;tt.style.transform=`translateY(${(1-tp)*40}px)`;
  document.getElementById('hsubs').innerHTML=opts.nosubs?'':subsHTML(t);
  // parte central
  document.getElementById('main').style.opacity=t<HOOK?0:1;
  document.getElementById('subs').innerHTML=(opts.nosubs||t<HOOK)?'':subsHTML(Math.min(t,dur-0.01));
  // teléfono: entra desde abajo y respira con un zoom lento; cada captura funde con la anterior
  const pe=ease((t-HOOK+0.2)/0.7);
  const zoom=(C.zooms||[]).reduce((z,k)=>z+k.amount*ease((t-k.at)/0.6)*(1-ease((t-(k.until??99))/0.6)),0);
  document.getElementById('phone').style.transform=`translateY(${(1-pe)*260}px) scale(${1+0.025*Math.sin(t*0.9)+zoom}) rotate(${(1-pe)*4}deg)`;
  let active=0;SHOTS.forEach((s,i)=>{if(t>=s.at)active=i});
  SHOTS.forEach((s,i)=>{
    let op=0;
    if(i===active)op=i===0?1:ease((t-s.at)/0.35);
    else if(i===active-1&&t<SHOTS[active].at+0.35)op=1;
    s.el.style.opacity=op;
    s.el.style.transform=`translateY(${-(s.pan||0)*ease((t-s.at)/(s.panDur||2))}%)`;
  });
  TAPS.forEach(tp=>{const p=clamp((t-tp.at)/0.7);tp.el.style.opacity=p>0&&p<1?(1-p)*0.95:0;tp.el.style.transform=`scale(${0.4+1.1*p})`});
  BADGES.forEach(b=>{
    const p=back((t-b.at)/0.5), q=b.out===undefined?1:1-ease((t-b.out)/0.3);
    const vis=t>=b.at;
    b.el.style.opacity=vis?clamp((t-b.at)/0.2)*q:0;
    const fl=Math.sin((t+b.x*0.01)*2.2)*6;
    b.el.style.transform=`translateY(${fl+(1-ease((t-b.at)/0.5))*30}px) scale(${vis?0.6+0.4*p:0.6})`;
  });
  TAGS.forEach((g,i)=>{
    const next=TAGS[i+1];
    const p=ease((t-g.at)/0.4), q=next?1-ease((t-next.at+0.2)/0.25):1;
    g.el.style.opacity=t>=g.at?p*q:0;
    g.el.style.transform=`translateX(-50%) translateY(${(1-p)*-20}px)`;
  });
  // cierre
  const ed=document.getElementById('end');
  const ep=ease((t-dur)/ENDXF);ed.style.opacity=t<dur?0:ep;
  ed.querySelectorAll('.e').forEach(e=>{const p=ease((t-dur-parseFloat(e.dataset.d))/0.45);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*36}px)`});
}
window.setup=setup;window.render=render;
</script></body></html>
