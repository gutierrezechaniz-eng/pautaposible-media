<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Manrope;font-weight:400;src:url(node_modules/@fontsource/manrope/files/manrope-latin-400-normal.woff2)}
@font-face{font-family:Manrope;font-weight:600;src:url(node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff2)}
@font-face{font-family:Manrope;font-weight:700;src:url(node_modules/@fontsource/manrope/files/manrope-latin-700-normal.woff2)}
@font-face{font-family:Manrope;font-weight:800;src:url(node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2)}
:root{--forest:#2E6F57;--cream:#FAFAF7;--mint:#DDEEDF;--sage:#6FA67A;--gold:#D7A95B;--char:#24322A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:Manrope,sans-serif;color:var(--char)}
.scene{position:absolute;inset:0;opacity:0}
.forest{background:var(--forest);color:var(--cream)}
.cream{background:var(--cream)}
.blob{position:absolute;border-radius:50%}
.a{will-change:transform,opacity}
/* safe zone: top 230px, bottom 384px free */
.zone{position:absolute;left:90px;right:90px;top:260px;bottom:420px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
.brand{position:absolute;left:0;right:0;top:250px;text-align:center;font-weight:700;font-size:34px;letter-spacing:.5px;opacity:.9}
.portrait{width:440px;height:440px;border-radius:50%;background:var(--mint);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;box-shadow:0 0 0 14px rgba(221,238,223,.25)}
.portrait img{width:92%;display:block}
.hook{font-weight:800;font-size:116px;line-height:1.02;letter-spacing:-2.5px;margin-top:70px}
.sub{font-weight:600;font-size:48px;line-height:1.25;margin-top:34px;opacity:.92}
.pill{display:inline-block;border-radius:999px;padding:18px 40px;font-weight:700;font-size:38px}
.pill.mint{background:var(--mint);color:var(--char)}
.pill.forest{background:var(--forest);color:var(--cream)}
.card{background:#fff;border-radius:56px;padding:80px 64px;width:100%;box-shadow:0 20px 60px rgba(36,50,42,.08)}
.big{font-weight:800;font-size:96px;line-height:1.05;letter-spacing:-2px;color:var(--char)}
.big em{font-style:normal;color:var(--forest)}
.small{font-weight:600;font-size:46px;line-height:1.3;margin-top:36px;color:#46574d}
.row{display:flex;flex-direction:column;gap:26px;align-items:center;margin-top:10px}
.handle{position:absolute;left:0;right:0;bottom:430px;text-align:center;font-weight:600;font-size:30px;opacity:.6}
.cta{display:inline-block;border-radius:999px;padding:30px 60px;font-weight:800;font-size:50px;background:var(--cream);color:var(--forest)}
.save{display:inline-block;border-radius:999px;padding:22px 54px;font-weight:700;font-size:42px;border:4px solid var(--gold);color:var(--cream)}
</style></head>
<body><div id="root"></div>
<script>
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
let SC=[];
function portrait(size){return `<div class="portrait a" data-zoom="1" style="width:${size}px;height:${size}px"><img src="ivan.png"></div>`}
function build(cfg){
  const root=document.getElementById('root');let html='';
  cfg.scenes.forEach((s,i)=>{
    if(s.kind==='hook'){
      html+=`<div class="scene forest" id="s${i}">
        <div class="blob" style="width:520px;height:520px;right:-180px;top:-120px;background:rgba(111,166,122,.28)"></div>
        <div class="blob a" data-d="0.3" style="width:110px;height:110px;right:120px;top:120px;background:var(--gold)"></div>
        <div class="zone" style="top:300px">${portrait(440)}
          <div class="hook a" data-d="0.15">${s.title}</div>
          ${s.sub?`<div class="sub a" data-d="0.55">${s.sub}</div>`:''}
        </div></div>`;
    } else if(s.kind==='end'){
      html+=`<div class="scene forest" id="s${i}">
        <div class="blob" style="width:600px;height:600px;left:-260px;bottom:-200px;background:rgba(111,166,122,.25)"></div>
        <div class="blob" style="width:90px;height:90px;right:130px;top:250px;background:var(--gold)"></div>
        <div class="zone" style="top:290px">${portrait(340)}
          <div class="a" data-d="0.15" style="font-weight:800;font-size:64px;margin-top:48px">Iván · Pauta Posible</div>
          <div class="a" data-d="0.3" style="font-weight:600;font-size:42px;margin-top:16px;opacity:.9">Nutrición práctica,<br>sin miedo ni culpa</div>
          <div class="a" data-d="0.55" style="margin-top:56px"><span class="cta">pautaposible.es/aprende</span></div>
          <div class="a" data-d="0.8" style="margin-top:34px"><span class="save">Guárdalo 🔖</span></div>
        </div>
        <div class="handle a" data-d="1.0" style="opacity:.6">@pautaposible</div></div>`;
    } else {
      html+=`<div class="scene cream" id="s${i}">
        <div class="blob" style="width:420px;height:420px;right:-160px;top:-60px;background:var(--mint)"></div>
        <div class="blob" style="width:70px;height:70px;left:110px;top:300px;background:var(--gold);opacity:.85"></div>
        <div class="zone" style="top:${s.top||380}px">
          ${s.tag?`<div class="a" data-d="0.05" style="margin-bottom:44px"><span class="pill mint">${s.tag}</span></div>`:''}
          ${s.visual?`<div class="a" data-d="0.1" style="margin-bottom:50px">${s.visual}</div>`:''}
          <div class="card a" data-d="0.2">
            <div class="big">${s.title}</div>
            ${s.small?`<div class="small">${s.small}</div>`:''}
            ${s.pills?`<div class="row" style="margin-top:44px">${s.pills.map((p,k)=>`<span class="pill forest a" data-d="${0.5+k*0.45}">${p}</span>`).join('')}</div>`:''}
          </div>
        </div>
        <div class="handle" style="color:var(--char);opacity:.45">@pautaposible</div></div>`;
    }
  });
  root.innerHTML=html;
  let t=0;SC=cfg.scenes.map((s,i)=>{const o={el:document.getElementById('s'+i),start:t,end:t+s.dur};t+=s.dur;return o});
  return t;
}
const FADE=0.35;
function render(t){
  SC.forEach((s,i)=>{
    const last=i===SC.length-1, first=i===0;
    let op=0;
    if(t>=s.start-(first?1:FADE)&&t<s.end+(last?1:0)){
      const fin=first?1:ease((t-s.start+FADE)/FADE);
      const fout=last?1:(t>s.end-FADE?Math.max(0,(s.end-t)/FADE):1);
      op=Math.min(fin,fout);
    }
    s.el.style.opacity=op;
    const lt=t-s.start;
    s.el.querySelectorAll('.a').forEach(e=>{
      if(e.dataset.zoom){const z=1+0.08*Math.min(Math.max(lt,0)/(s.end-s.start),1);e.querySelector('img').style.transform=`scale(${z})`;e.querySelector('img').style.transformOrigin='50% 100%';
        const p=ease(lt/0.6);e.style.transform=`scale(${0.85+0.15*p})`;e.style.opacity=p;return}
      const d=parseFloat(e.dataset.d||0);const p=ease((lt-d)/0.6);
      e.style.opacity=p;e.style.transform=`translateY(${(1-p)*50}px)`;
    });
  });
}
window.build=build;window.render=render;
</script></body></html>
